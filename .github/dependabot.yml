# Weekly dependency updates for a standalone web-design project.
#
# Minor and patch updates arrive as one grouped pull request; major updates
# stay separate so they are reviewed individually. The cooldown keeps a freshly
# published version out of the repository for a few days.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Action tags are not guaranteed to be semantic versions, so only the
    # default cooldown applies to this ecosystem.
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The website's own npm dependencies (wrangler for the stage worker). The
  # root harness package.json has no dependencies, so it is not watched.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
