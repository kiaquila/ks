name: Project CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run project and harness checks
        run: npm run preflight

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            .
        continue-on-error: true

      - name: Verify dependency scan completed
        if: ${{ steps.scan.outcome == 'failure' }}
        env:
          RESULTS: osv-results.json
        run: |
          if [ ! -s "${RESULTS}" ]; then
            echo "::error::OSV Scanner failed without writing ${RESULTS}; refusing to report a clean scan."
            exit 1
          fi

      - name: Report vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true
