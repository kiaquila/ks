name: KS Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "website/**"

permissions:
  contents: read

jobs:
  required-checks:
    name: production-required-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for required push and pull-request checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/wait-for-production-checks.mjs

  register-latest:
    name: production-register-latest
    needs: required-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      current: ${{ steps.register.outputs.current }}
    environment:
      name: production
      url: https://ks-design.art
    steps:
      - name: Checkout validated production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Connect to the deployment Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.KS_DESIGN_SSH_HOST }}

      - name: Register the newest eligible KS candidate
        id: register
        shell: bash
        env:
          REVISION: ${{ github.sha }}
          GITHUB_ACTIONS: "true"
          GITHUB_REF: refs/heads/main
          KS_DESIGN_EXPECTED_REVISION: ${{ github.sha }}
          KS_DESIGN_DEPLOY_RUN_ID: ${{ github.run_id }}
          KS_DESIGN_DEPLOY_TARGET: ks-production
          KS_DESIGN_DEPLOY_MODE: register
          KS_DESIGN_SSH_CONFIG: ${{ runner.temp }}/ks-production-ssh-config
          KS_DESIGN_DEPLOY_STATUS_FILE: ${{ runner.temp }}/ks-production-deploy-status
          KS_DESIGN_SSH_PRIVATE_KEY: ${{ secrets.KS_DESIGN_SSH_PRIVATE_KEY }}
          KS_DESIGN_SSH_HOST: ${{ vars.KS_DESIGN_SSH_HOST }}
          KS_DESIGN_SSH_KNOWN_HOSTS: ${{ vars.KS_DESIGN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          umask 077
          key_file="$RUNNER_TEMP/ks-production-deploy-key"
          known_hosts_file="$RUNNER_TEMP/ks-production-known-hosts"
          printf '%s\n' "$KS_DESIGN_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$KS_DESIGN_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          cat > "$KS_DESIGN_SSH_CONFIG" <<EOF
          Host ks-production
            HostName $KS_DESIGN_SSH_HOST
            User ksdeploy
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file
          EOF

          website/production/deploy.sh
          if [[ -f "$KS_DESIGN_DEPLOY_STATUS_FILE" ]] &&
            [[ "$(<"$KS_DESIGN_DEPLOY_STATUS_FILE")" == "skipped" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$(<"$KS_DESIGN_DEPLOY_STATUS_FILE")" == "registered" ]]
          echo "current=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: production-deploy
    needs:
      - required-checks
      - register-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.register-latest.outputs.current == 'true'
    # Only candidates already registered on cz enter this group. That prevents a
    # late stale gate from replacing the newest pending GitHub job.
    concurrency:
      group: ks-production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment:
      name: production
      url: https://ks-design.art
    steps:
      - name: Checkout registered production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Connect to the deployment Tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.KS_DESIGN_SSH_HOST }}

      - name: Deploy, validate, purge, and verify the latest revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
          GITHUB_ACTIONS: "true"
          GITHUB_REF: refs/heads/main
          KS_DESIGN_EXPECTED_REVISION: ${{ github.sha }}
          KS_DESIGN_DEPLOY_RUN_ID: ${{ github.run_id }}
          KS_DESIGN_DEPLOY_TARGET: ks-production
          KS_DESIGN_SSH_CONFIG: ${{ runner.temp }}/ks-production-ssh-config
          KS_DESIGN_DEPLOY_STATUS_FILE: ${{ runner.temp }}/ks-production-deploy-status
          KS_DESIGN_SSH_PRIVATE_KEY: ${{ secrets.KS_DESIGN_SSH_PRIVATE_KEY }}
          KS_DESIGN_SSH_HOST: ${{ vars.KS_DESIGN_SSH_HOST }}
          KS_DESIGN_SSH_KNOWN_HOSTS: ${{ vars.KS_DESIGN_SSH_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          umask 077
          key_file="$RUNNER_TEMP/ks-production-deploy-key"
          known_hosts_file="$RUNNER_TEMP/ks-production-known-hosts"
          printf '%s\n' "$KS_DESIGN_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$KS_DESIGN_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          cat > "$KS_DESIGN_SSH_CONFIG" <<EOF
          Host ks-production
            HostName $KS_DESIGN_SSH_HOST
            User ksdeploy
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file
          EOF

          website/production/deploy.sh
          if [[ -f "$KS_DESIGN_DEPLOY_STATUS_FILE" ]] &&
            [[ "$(<"$KS_DESIGN_DEPLOY_STATUS_FILE")" == "skipped" ]]; then
            echo "A newer eligible KS deployment has already reached cz."
            exit 0
          fi
          # Every check below names itself before it runs and, when it trips,
          # prints what it expected against what it got. This block used to be
          # a run of bare `test` comparisons, and when the sha256 guard failed
          # on 2026-08-29 the step exited 1 without printing a single line —
          # a deployed, healthy site with a silent red job, and the cause had
          # to be reconstructed by reading the workflow. A check that cannot
          # say why it failed costs more than the one it guards against.
          verify() {
            local what="$1" expected="$2" actual="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$what: expected '$expected', got '$actual'"
              exit 1
            fi
            printf '  ok  %s: %s\n' "$what" "$actual"
          }

          echo "Purging the Cloudflare cache for the deployed revision."
          if [[ ! "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID is not a 32-character hex zone id (it is ${#CLOUDFLARE_ZONE_ID} characters). Set it on the production environment."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Set the secret on the production environment."
            exit 1
          fi
          response="$RUNNER_TEMP/cloudflare-purge.json"
          if ! curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --output "$response" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"; then
            echo "::error::The Cloudflare purge request failed. Its response, if any, follows."
            cat "$response" 2>/dev/null || true
            exit 1
          fi
          if ! python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("success") is True else 1)' "$response"; then
            echo "::error::Cloudflare did not report the purge as successful. Its response follows."
            cat "$response"
            exit 1
          fi
          echo "  ok  cache purged"

          # These three requests carry no `--fail`: the status IS what is
          # being checked, and `--fail` would abort the step under `set -e`
          # before `verify` could name the page and print what it got — the
          # silence this block exists to remove. `--retry` still covers the
          # transient 5xx a just-restarted origin can serve, and a request
          # that cannot complete at all still fails curl, so each one says
          # which URL it could not reach.
          echo "Verifying https://ks-design.art serves revision $REVISION."
          if ! root_status="$(
            curl --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null --write-out '%{http_code}' https://ks-design.art/
          )"; then
            echo "::error::Could not reach https://ks-design.art/ at all."
            exit 1
          fi
          verify "the English page at /" "200" "$root_status"
          if ! spanish_status="$(
            curl --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null --write-out '%{http_code}' https://ks-design.art/es/
          )"; then
            echo "::error::Could not reach https://ks-design.art/es/ at all."
            exit 1
          fi
          verify "the Spanish page at /es/" "200" "$spanish_status"
          if ! legacy_english_redirect="$(
            curl --silent --show-error --retry 5 --retry-all-errors \
              --output /dev/null --write-out '%{redirect_url}' https://ks-design.art/en/
          )"; then
            echo "::error::Could not reach https://ks-design.art/en/ at all."
            exit 1
          fi
          verify "the retired /en/ redirect" "https://ks-design.art/" "$legacy_english_redirect"
          production_asset="$RUNNER_TEMP/production-site.js"
          if ! curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output "$production_asset" \
            "https://ks-design.art/assets/site.js?revision=$REVISION"; then
            echo "::error::Could not fetch https://ks-design.art/assets/site.js — the deployed site is not serving the script."
            exit 1
          fi
          expected="$(sha256sum website/src/js/site.js | cut -d ' ' -f 1)"
          actual="$(sha256sum "$production_asset" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::/assets/site.js is not the file in website/src/js/site.js: expected sha256 $expected, got $actual. The build copies the script byte for byte, so a transform added to scripts/build.mjs — or a stale cache — breaks this."
            exit 1
          fi
          printf '  ok  /assets/site.js matches its source: %s\n' "$expected"
