name: KS Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "ks/**"

permissions:
  contents: read

jobs:
  required-checks:
    name: production-required-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for required push and pull-request checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: node scripts/wait-for-production-checks.mjs

  deploy:
    name: production-deploy
    needs: required-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # GitHub retains only the newest pending candidate. The root-owned server
    # wrapper also rejects an older run ID that reaches it after a newer one.
    concurrency:
      group: ks-production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment:
      name: production
      url: https://ks-design.art
    steps:
      - name: Checkout validated production revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Connect to the deployment Tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.KS_DESIGN_SSH_HOST }}

      - name: Deploy, validate, purge, and verify the latest revision
        shell: bash
        env:
          REVISION: ${{ github.sha }}
          GITHUB_ACTIONS: "true"
          GITHUB_REF: refs/heads/main
          KS_DESIGN_EXPECTED_REVISION: ${{ github.sha }}
          KS_DESIGN_DEPLOY_RUN_ID: ${{ github.run_id }}
          KS_DESIGN_DEPLOY_TARGET: ks-production
          KS_DESIGN_SSH_CONFIG: ${{ runner.temp }}/ks-production-ssh-config
          KS_DESIGN_DEPLOY_STATUS_FILE: ${{ runner.temp }}/ks-production-deploy-status
          KS_DESIGN_SSH_PRIVATE_KEY: ${{ secrets.KS_DESIGN_SSH_PRIVATE_KEY }}
          KS_DESIGN_SSH_HOST: ${{ vars.KS_DESIGN_SSH_HOST }}
          KS_DESIGN_SSH_KNOWN_HOSTS: ${{ vars.KS_DESIGN_SSH_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          umask 077
          key_file="$RUNNER_TEMP/ks-production-deploy-key"
          known_hosts_file="$RUNNER_TEMP/ks-production-known-hosts"
          printf '%s\n' "$KS_DESIGN_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$KS_DESIGN_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          cat > "$KS_DESIGN_SSH_CONFIG" <<EOF
          Host ks-production
            HostName $KS_DESIGN_SSH_HOST
            User ksdeploy
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file
          EOF

          ks/website/production/deploy.sh
          if [[ -f "$KS_DESIGN_DEPLOY_STATUS_FILE" ]] &&
            [[ "$(<"$KS_DESIGN_DEPLOY_STATUS_FILE")" == "skipped" ]]; then
            echo "A newer eligible KS deployment has already reached cz."
            exit 0
          fi
          [[ "$CLOUDFLARE_ZONE_ID" =~ ^[a-f0-9]{32}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          response="$RUNNER_TEMP/cloudflare-purge.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --output "$response" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["success"] is True' "$response"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --output /dev/null https://ks-design.art/
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --output /dev/null https://ks-design.art/en/
          production_asset="$RUNNER_TEMP/production-site.js"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --header 'Cache-Control: no-cache' \
            --output "$production_asset" \
            "https://ks-design.art/assets/site.js?revision=$REVISION"
          expected="$(sha256sum ks/website/src/js/site.js | cut -d ' ' -f 1)"
          actual="$(sha256sum "$production_asset" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
