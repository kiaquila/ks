<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ks">
  <!-- White lowercase ks on the cornflower-gradient plate (client pick,
       2026-08-31, variant 20 of the favicon show; it replaced the type-set
       transparent "KS." of 2026-08-29). Two decisions live here:

       The letters are BAKED OUTLINES of Manrope wght 700 — the wordmark's
       own face and weight — extracted from assets/fonts/manrope-latin.woff2
       with fontTools. The old favicon set its caps as <text> in a system
       stack (favicons cannot load webfonts), and at a tab's 16px every
       engine rasterized its own substitute into mush; paths make the mark
       identical everywhere. The lowercase is deliberate — a nod to the
       original ks-design lowercase mark.

       The plate is the page's one chromatic device, --brand-dot's
       135-degree indigo-to-cyan, and it is OPAQUE: the icon reads the same
       on light and dark tab strips, so the SVG carries no dark-scheme
       media query any more (make-icons.mjs and the favicon test both
       assert that stays true). The 14/64 corner radius survives legibly
       at 16px; only the corners outside it are transparent.

       The raster renditions are baked FROM this file — regenerate them with
       scripts/make-icons.mjs whenever this geometry moves, and bump the
       links' ?v= in src/render.js. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <path fill="#ffffff" d="M10 47.67 10.04 15.67H15.46V35.23L24.23 23.67H30.92L21.61 35.67L31.72 47.67H24.63L15.46 36.11V47.67Z"/>
