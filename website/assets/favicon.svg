<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ks">
  <!-- The wordmark's monogram set as type, not a drawn mark. No background
       plate: the letters flip black/white with the browser theme, so the tab
       icon reads on both. Favicons cannot load webfonts, so the stack leans
       on the system's closest grotesk. -->
  <style>
    /* Sized to fill most of the 64px square: at a tab's 16px the original 40px
       type left a third of the icon as margin and read as a smudge, while 56px
       crowded the edges. The baseline sits so the cap height, which is all "ks"
       has, is centred rather than hanging low in the box. */
    text {
      font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -2px;
      fill: #0b0b0c;
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
    }
  </style>
  <text x="32" y="49" text-anchor="middle">ks</text>
</svg>
