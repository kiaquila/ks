<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ks">
  <!-- The wordmark's monogram set as type, not a drawn mark, in the tracked
       caps the wordmark uses, with the cornflower-gradient dot sitting on
       the baseline after the letters. No background plate: the letters flip
       black/white with the browser theme, so the tab icon reads on both;
       the gradient dot stays the same on either. Favicons cannot load
       webfonts, so the stack leans on the system's closest grotesk. -->
  <style>
    /* The mark runs edge to edge: at a crowded tab strip's 16px, any
       margin left in the box reads as a shrunken icon (client pick,
       2026-08-29). The caps stepped 38px -> 37px to buy the grown dot its
       air inside the same square; the baseline sits so the cap height is
       centred rather than hanging low in the box. The raster renditions
       are baked FROM this file — regenerate them with
       scripts/make-icons.mjs whenever this geometry moves. */
    text {
      font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 37px;
      font-weight: 700;
      letter-spacing: 0;
      fill: #0b0b0c;
    }
    @media (prefers-color-scheme: dark) {
      text { fill: #ffffff; }
    }
  </style>
  <defs>
    <!-- 135° like --brand-dot: indigo top-left into cyan bottom-right. -->
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <text x="24.6" y="45.4" text-anchor="middle">KS</text>
  <circle cx="58.8" cy="40.2" r="5.2" fill="url(#dot)"/>
</svg>
