# Dedicated edge for the KS portfolio. The upstream is the isolated
# `ks-design-portfolio` Compose project; Capsule Zero uses different ports.
server {
    listen 80;
    listen [::]:80;
    server_name ks-design.art www.ks-design.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://ks-design.art$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ks-design.art;

    ssl_certificate /etc/letsencrypt/live/ks-design.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ks-design.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://ks-design.art$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ks-design.art;

    ssl_certificate /etc/letsencrypt/live/ks-design.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ks-design.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ks-design.art.access.log;
    error_log /var/log/nginx/ks-design.art.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
